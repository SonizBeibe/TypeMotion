# Cross file to build the TypeMotion core for iPhone (arm64) with Xcode.
# Only works on a Mac. @SDK@ is the iPhoneOS SDK folder, which the CI
# workflow (.github/workflows/ios-core.yml) fills in with
#   xcrun --sdk iphoneos --show-sdk-path
# iOS 16.3 is the first with std::from_chars for floating point numbers.

[constants]
sdk = '@SDK@'
target = ['-arch', 'arm64', '-isysroot', sdk, '-miphoneos-version-min=16.3']

[binaries]
c = ['clang'] + target
cpp = ['clang++'] + target
objc = ['clang'] + target
objcpp = ['clang++'] + target
ar = 'ar'
strip = 'strip'
nm = 'nm'
ranlib = 'ranlib'

[built-in options]
c_link_args = target
cpp_link_args = target
objc_link_args = target
objcpp_link_args = target

[host_machine]
system = 'darwin'
subsystem = 'ios'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'
