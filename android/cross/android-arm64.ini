# Cross file to build the TypeMotion core for Android (arm64) with the NDK.
# Set ndk below to your NDK folder (the default is where Android Studio's
# SDK manager puts NDK 27.2), then from the repository root:
#   meson setup <builddir> --cross-file android/cross/android-arm64.ini ...
# (see android/README.md)

[constants]
ndk = 'C:/Users/PC/Android/Sdk/ndk/27.2.12479018'
toolchain = ndk / 'toolchains/llvm/prebuilt/windows-x86_64'
target = ['--target=aarch64-linux-android26']

[binaries]
c = [toolchain / 'bin/clang.exe'] + target
cpp = [toolchain / 'bin/clang++.exe'] + target
ar = toolchain / 'bin/llvm-ar.exe'
strip = toolchain / 'bin/llvm-strip.exe'
ranlib = toolchain / 'bin/llvm-ranlib.exe'
# FFmpeg lists the symbols its libraries export with nm
nm = toolchain / 'bin/llvm-nm.exe'

[built-in options]
c_args = ['-fPIC']
cpp_args = ['-fPIC']
# Link the C++ runtime into libtypemotion.so so it's the only library to ship
cpp_link_args = ['-static-libstdc++']

[host_machine]
system = 'android'
subsystem = 'android'
kernel = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
